[graph]
all-features = true

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
  { id = "RUSTSEC-2026-0194", reason = "Transitive object_store 0.14 S3 response XML parser; endpoint is configured infrastructure, request payloads are not XML, and this is tracked for removal when object_store releases a quick-xml >=0.41 update." },
  { id = "RUSTSEC-2026-0195", reason = "Transitive object_store 0.14 S3 response XML parser; endpoint is configured infrastructure, request payloads are not XML, and this is tracked for removal when object_store releases a quick-xml >=0.41 update." },
]

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.8
exceptions = []

[bans]
multiple-versions = "allow"
wildcards = "allow"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
