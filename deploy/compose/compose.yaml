name: mh-save-sync
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mh_save_sync
      POSTGRES_USER: mh_save_sync
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mh_save_sync -d mh_save_sync"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
  minio:
    image: minio/minio:RELEASE.2026-06-14T17-43-55Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
    secrets:
      - minio_root_user
      - minio_root_password
    volumes:
      - minio-data:/data
    ports:
      - "19000:9000"
      - "19001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
  server:
    build:
      context: ../..
      dockerfile: deploy/compose/server.Dockerfile
    environment:
      MH_SAVE_SYNC_BIND: 0.0.0.0:8080
      DATABASE_URL: postgres://mh_save_sync@postgres:5432/mh_save_sync
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: mh-save-sync
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "18080:8080"
    healthcheck:
      test: ["CMD", "/app/mh-save-server", "--healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
volumes:
  postgres-data:
  minio-data:
secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  minio_root_user:
    file: ./secrets/minio_root_user.txt
  minio_root_password:
    file: ./secrets/minio_root_password.txt
