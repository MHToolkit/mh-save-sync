name: mh-save-sync
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mh_save_sync
      POSTGRES_USER: mh_save_sync
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mh_save_sync -d mh_save_sync"]
      interval: ${MH_SAVE_SYNC_DB_HEALTH_INTERVAL:-15s}
      timeout: ${MH_SAVE_SYNC_DB_HEALTH_TIMEOUT:-5s}
      retries: ${MH_SAVE_SYNC_DB_HEALTH_RETRIES:-20}
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        export MINIO_ROOT_USER="$$(cat /run/secrets/minio_root_user)";
        export MINIO_ROOT_PASSWORD="$$(cat /run/secrets/minio_root_password)";
        exec minio server /data --console-address :9001
    secrets:
      - minio_root_user
      - minio_root_password
    volumes:
      - minio-data:/data
    ports:
      - "${MH_SAVE_SYNC_MINIO_API_PORT:-19000}:9000"
      - "${MH_SAVE_SYNC_MINIO_CONSOLE_PORT:-19001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: ${MH_SAVE_SYNC_MINIO_HEALTH_INTERVAL:-15s}
      timeout: ${MH_SAVE_SYNC_MINIO_HEALTH_TIMEOUT:-5s}
      retries: ${MH_SAVE_SYNC_MINIO_HEALTH_RETRIES:-20}
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
  minio-init:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        export MINIO_ROOT_USER="$$(cat /run/secrets/minio_root_user)";
        export MINIO_ROOT_PASSWORD="$$(cat /run/secrets/minio_root_password)";
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD";
        mc mb -p "local/$${S3_BUCKET:-mh-save-sync}";
        mc version enable "local/$${S3_BUCKET:-mh-save-sync}" || true
    environment:
      S3_BUCKET: mh-save-sync
    secrets:
      - minio_root_user
      - minio_root_password
    depends_on:
      minio:
        condition: service_healthy
  server:
    build:
      context: ../..
      dockerfile: deploy/compose/server.Dockerfile
    environment:
      MH_SAVE_SYNC_BIND: 0.0.0.0:8080
      # Read 0600 file-backed secrets before Tokio starts, then permanently
      # drop the server process to the distroless nonroot identity.
      MH_SAVE_SYNC_RUNTIME_UID: "65532"
      MH_SAVE_SYNC_RUNTIME_GID: "65532"
      MH_SAVE_SYNC_RUNTIME_IDENTITY_FILE: /tmp/mh-save-sync-runtime-identity
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_USER: mh_save_sync
      DATABASE_NAME: mh_save_sync
      DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: mh-save-sync
      S3_REGION: us-east-1
      S3_ACCESS_KEY_FILE: /run/secrets/minio_root_user
      S3_SECRET_KEY_FILE: /run/secrets/minio_root_password
      AWS_EC2_METADATA_DISABLED: "true"
      RUST_LOG: save_server=info,tower_http=info
    secrets:
      - postgres_password
      - minio_root_user
      - minio_root_password
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "${MH_SAVE_SYNC_HTTP_PORT:-18080}:8080"
    healthcheck:
      test: ["CMD", "/app/mh-save-server", "--healthcheck"]
      interval: ${MH_SAVE_SYNC_SERVER_HEALTH_INTERVAL:-30s}
      timeout: ${MH_SAVE_SYNC_SERVER_HEALTH_TIMEOUT:-5s}
      retries: ${MH_SAVE_SYNC_SERVER_HEALTH_RETRIES:-12}
      start_period: ${MH_SAVE_SYNC_SERVER_HEALTH_START_PERIOD:-20s}
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
volumes:
  postgres-data:
  minio-data:
secrets:
  postgres_password:
    file: ${MH_SAVE_SYNC_SECRETS_DIR:-./secrets}/postgres_password.txt
  minio_root_user:
    file: ${MH_SAVE_SYNC_SECRETS_DIR:-./secrets}/minio_root_user.txt
  minio_root_password:
    file: ${MH_SAVE_SYNC_SECRETS_DIR:-./secrets}/minio_root_password.txt
