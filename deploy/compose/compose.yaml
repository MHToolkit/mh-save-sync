name: mh-save-sync
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mh_save_sync
      POSTGRES_USER: mh_save_sync
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mh_save_sync -d mh_save_sync"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:9966a92a734f9411e32f4f41d7d9d826fcdc0f68c4e20b70295bd4e7c11f8a2f
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        export MINIO_ROOT_USER="$$(cat /run/secrets/minio_root_user)";
        export MINIO_ROOT_PASSWORD="$$(cat /run/secrets/minio_root_password)";
        exec minio server /data --console-address :9001
    secrets:
      - minio_root_user
      - minio_root_password
    volumes:
      - minio-data:/data
    ports:
      - "19000:9000"
      - "19001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
  server:
    build:
      context: ../..
      dockerfile: deploy/compose/server.Dockerfile
    environment:
      MH_SAVE_SYNC_BIND: 0.0.0.0:8080
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_USER: mh_save_sync
      DATABASE_NAME: mh_save_sync
      DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: mh-save-sync
      S3_REGION: us-east-1
      S3_ACCESS_KEY_FILE: /run/secrets/minio_root_user
      S3_SECRET_KEY_FILE: /run/secrets/minio_root_password
      AWS_EC2_METADATA_DISABLED: "true"
      RUST_LOG: save_server=info,tower_http=info
    secrets:
      - postgres_password
      - minio_root_user
      - minio_root_password
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "18080:8080"
    healthcheck:
      test: ["CMD", "/app/mh-save-server", "--healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
volumes:
  postgres-data:
  minio-data:
secrets:
  postgres_password:
    file: ${MH_SAVE_SYNC_SECRETS_DIR:-./secrets}/postgres_password.txt
  minio_root_user:
    file: ${MH_SAVE_SYNC_SECRETS_DIR:-./secrets}/minio_root_user.txt
  minio_root_password:
    file: ${MH_SAVE_SYNC_SECRETS_DIR:-./secrets}/minio_root_password.txt
