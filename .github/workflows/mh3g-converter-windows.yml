name: mh3g-converter-windows

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/mh3g-save-convert/**
      - README.md
      - README.zh-CN.md
      - apps/mh3g-save-converter-windows/**
      - packaging/mh3g-save-convert/**
      - scripts/mh3g-windows-launcher.ps1
      - scripts/package-mh3g-save-converter-windows.ps1
      - scripts/verify-mh3g-save-converter-windows-source.py
      - .github/workflows/mh3g-converter-windows.yml
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/mh3g-save-convert/**
      - README.md
      - README.zh-CN.md
      - apps/mh3g-save-converter-windows/**
      - packaging/mh3g-save-convert/**
      - scripts/mh3g-windows-launcher.ps1
      - scripts/package-mh3g-save-converter-windows.ps1
      - scripts/verify-mh3g-save-converter-windows-source.py
      - .github/workflows/mh3g-converter-windows.yml

permissions:
  contents: read

jobs:
  package-windows-x64:
    name: package Windows x64 executable
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - uses: Swatinem/rust-cache@v2
        timeout-minutes: 8
        continue-on-error: true
      - name: Verify WinUI source contract
        run: python scripts/verify-mh3g-save-converter-windows-source.py
      # Keep CI and the Windows tester on one implementation. The script does
      # not launch the WinUI process, Cemu, or any real save; it runs only the
      # packaged sidecar and a disposable synthetic write/rollback smoke.
      - name: Package and self-verify Windows x64 archive
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/package-mh3g-save-converter-windows.ps1
      - name: Upload Windows package transcript on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: mh3g-save-convert-windows-build-transcript-${{ github.sha }}
          path: artifacts/mh3g-save-convert-windows-build-transcript.txt
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@v5
        if: success()
        with:
          name: mh3g-save-convert-windows-x64-${{ github.sha }}
          path: |
            artifacts/mh3g-save-convert-windows-x64.zip
            artifacts/mh3g-save-convert-windows-x64.zip.sha256
            artifacts/mh3g-save-convert.exe.sha256
            artifacts/mh3g-save-convert-windows-build-transcript.txt
          if-no-files-found: error
          retention-days: 30
