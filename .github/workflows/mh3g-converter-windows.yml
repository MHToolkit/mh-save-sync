name: mh3g-converter-windows

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/mh3g-save-convert/**
      - README.md
      - README.zh-CN.md
      - apps/mh3g-save-converter-windows/**
      - packaging/mh3g-save-convert/**
      - scripts/mh3g-windows-launcher.ps1
      - scripts/verify-mh3g-save-converter-windows-source.py
      - .github/workflows/mh3g-converter-windows.yml
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/mh3g-save-convert/**
      - README.md
      - README.zh-CN.md
      - apps/mh3g-save-converter-windows/**
      - packaging/mh3g-save-convert/**
      - scripts/mh3g-windows-launcher.ps1
      - scripts/verify-mh3g-save-converter-windows-source.py
      - .github/workflows/mh3g-converter-windows.yml

permissions:
  contents: read

jobs:
  package-windows-x64:
    name: package Windows x64 executable
    runs-on: windows-2022
    timeout-minutes: 20
    # Produce a self-contained Rust CRT binary so the tester does not need a
    # separately installed Visual C++ Redistributable.
    env:
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - uses: Swatinem/rust-cache@v2
        timeout-minutes: 8
        continue-on-error: true
      - name: Verify WinUI source contract
        run: python scripts/verify-mh3g-save-converter-windows-source.py
      - name: Test the converter on Windows x64
        run: cargo test --locked -p mh3g-save-convert
      - name: Build release executable
        run: cargo build --locked --release -p mh3g-save-convert --bin mh3g-save-convert
      - name: Run release executable smoke check
        run: .\target\release\mh3g-save-convert.exe --help
      - name: Publish native WinUI x64 application with bundled sidecar
        shell: pwsh
        run: |
          $stage = "artifacts/mh3g-save-convert-windows-x64"
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          dotnet publish apps/mh3g-save-converter-windows/MH3GSaveConverter.Windows.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:Platform=x64 `
            -p:WindowsAppSDKSelfContained=true `
            -o $stage
          if ($LASTEXITCODE -ne 0) {
            throw "WinUI publish failed with exit code $LASTEXITCODE"
          }
          New-Item -ItemType Directory -Force "$stage/tools" | Out-Null
          Copy-Item "target/release/mh3g-save-convert.exe" "$stage/tools/mh3g-save-convert.exe"
          $sidecarHash = (Get-FileHash -Algorithm SHA256 "$stage/tools/mh3g-save-convert.exe").Hash.ToLowerInvariant()
          "$sidecarHash  mh3g-save-convert.exe" | Set-Content -NoNewline -Encoding ascii "$stage/tools/mh3g-save-convert.exe.sha256"
          "$sidecarHash  mh3g-save-convert.exe" | Set-Content -NoNewline -Encoding ascii "artifacts/mh3g-save-convert.exe.sha256"
          Copy-Item "scripts/mh3g-windows-launcher.ps1" "$stage/Run-Converter.ps1"
          Copy-Item "apps/mh3g-save-converter-windows/README.md" "$stage/README-Windows-UI.md"
          Copy-Item "apps/mh3g-save-converter-windows/README.zh-CN.md" "$stage/README-Windows-UI.zh-CN.md"
          Copy-Item "packaging/mh3g-save-convert/README-Windows.txt" "$stage/README-Windows.txt"
      - name: Package and self-verify archive
        shell: pwsh
        run: |
          $stage = "artifacts/mh3g-save-convert-windows-x64"
          $archive = "artifacts/mh3g-save-convert-windows-x64.zip"
          $checksum = "artifacts/mh3g-save-convert-windows-x64.zip.sha256"
          $exeChecksum = "artifacts/mh3g-save-convert.exe.sha256"
          Remove-Item $archive, $checksum -Force -ErrorAction SilentlyContinue
          if (-not (Test-Path "$stage/MH3GSaveConverter.exe" -PathType Leaf)) {
            throw "published WinUI executable is missing"
          }
          if (-not (Test-Path "$stage/tools/mh3g-save-convert.exe" -PathType Leaf)) {
            throw "published Rust sidecar is missing"
          }
          Compress-Archive -Path $stage -DestinationPath $archive -Force
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          "$hash  mh3g-save-convert-windows-x64.zip" | Set-Content -NoNewline -Encoding ascii $checksum
          $verifyDir = Join-Path $env:RUNNER_TEMP "mh3g-save-convert-windows-x64-verify"
          Expand-Archive -Path $archive -DestinationPath $verifyDir -Force
          $packagedApp = "$verifyDir/mh3g-save-convert-windows-x64/MH3GSaveConverter.exe"
          $packagedSidecar = "$verifyDir/mh3g-save-convert-windows-x64/tools/mh3g-save-convert.exe"
          $packagedSidecarChecksum = "$verifyDir/mh3g-save-convert-windows-x64/tools/mh3g-save-convert.exe.sha256"
          if (-not (Test-Path "$verifyDir/mh3g-save-convert-windows-x64/MH3GSaveConverter.exe" -PathType Leaf)) {
            throw "GUI executable is missing"
          }
          if (-not (Test-Path "$verifyDir/mh3g-save-convert-windows-x64/tools/mh3g-save-convert.exe" -PathType Leaf)) {
            throw "GUI sidecar is missing"
          }
          $launcher = "$verifyDir/mh3g-save-convert-windows-x64/Run-Converter.ps1"
          $packagedReadme = "$verifyDir/mh3g-save-convert-windows-x64/README-Windows.txt"
          if (-not (Test-Path $launcher)) {
            throw "packaged launcher is missing"
          }
          if (-not (Test-Path $packagedSidecarChecksum)) {
            throw "packaged sidecar checksum is missing"
          }
          if (-not (Test-Path $packagedReadme)) {
            throw "packaged bilingual README is missing"
          }
          $expectedSidecarHash = ((Get-Content -LiteralPath $packagedSidecarChecksum -Raw).Trim() -split '\s+')[0]
          $actualSidecarHash = (Get-FileHash -Algorithm SHA256 $packagedSidecar).Hash.ToLowerInvariant()
          if ($actualSidecarHash -ne $expectedSidecarHash) {
            throw "packaged sidecar checksum verification failed"
          }
          # This is intentionally a layout-only GUI smoke: never launch the
          # foreground WinUI process in CI.  The launcher below exercises only
          # the bundled Rust sidecar against synthetic bytes.
          if ((Get-Item -LiteralPath $packagedApp).Length -le 0) {
            throw "packaged GUI executable is empty"
          }
          Set-Content -Path "${packagedSidecar}:Zone.Identifier" -Encoding ascii -Value "[ZoneTransfer]`r`nZoneId=3"
          if (-not (Get-Item -LiteralPath $packagedSidecar -Stream Zone.Identifier -ErrorAction SilentlyContinue)) {
            throw "failed to attach Mark-of-the-Web test stream"
          }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File $launcher --help
          if ($LASTEXITCODE -ne 0) {
            throw "packaged launcher smoke check failed with exit code $LASTEXITCODE"
          }
          if (Get-Item -LiteralPath $packagedSidecar -Stream Zone.Identifier -ErrorAction SilentlyContinue) {
            throw "packaged launcher did not remove Mark-of-the-Web"
          }
          $smokeRoot = Join-Path $env:RUNNER_TEMP "mh3g-converter-write-smoke"
          $smokeSourceDir = Join-Path $smokeRoot "source"
          $smokeTargetDir = Join-Path $smokeRoot "target"
          Remove-Item $smokeRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $smokeSourceDir, $smokeTargetDir | Out-Null
          $smokeSource = Join-Path $smokeSourceDir "user2"
          $smokeTarget = Join-Path $smokeTargetDir "user2"
          $sourceBytes = [byte[]]::new(0x8A00)
          $sourceBytes[0] = 0x2B
          [System.IO.File]::WriteAllBytes($smokeSource, $sourceBytes)
          $previousBytes = [byte[]]::new(0x8A24)
          $previousBytes[0] = 0xA5
          [System.IO.File]::WriteAllBytes($smokeTarget, $previousBytes)
          $sourceHashBefore = (Get-FileHash -Algorithm SHA256 $smokeSource).Hash
          $targetHashBefore = (Get-FileHash -Algorithm SHA256 $smokeTarget).Hash
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File $launcher convert $smokeSource --output $smokeTarget --write
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $smokeTarget)) {
            throw "packaged launcher write smoke failed with exit code $LASTEXITCODE"
          }
          $smokeManifest = Join-Path $smokeTargetDir ".user2.mh3g-install.json"
          $smokeBackups = @(Get-ChildItem -LiteralPath $smokeTargetDir -Filter ".user2.mh3g-backup-*")
          if (-not (Test-Path $smokeManifest) -or $smokeBackups.Count -ne 1) {
            throw "packaged launcher did not create exactly one manifest and backup"
          }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File $launcher rollback --manifest $smokeManifest
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $smokeTarget) -or (Test-Path $smokeManifest)) {
            throw "packaged launcher rollback smoke failed with exit code $LASTEXITCODE"
          }
          if (@(Get-ChildItem -LiteralPath $smokeTargetDir -Filter ".user2.mh3g-backup-*").Count -ne 0) {
            throw "packaged launcher rollback left a backup behind"
          }
          $sourceHashAfter = (Get-FileHash -Algorithm SHA256 $smokeSource).Hash
          $targetHashAfter = (Get-FileHash -Algorithm SHA256 $smokeTarget).Hash
          if ($sourceHashAfter -ne $sourceHashBefore -or $targetHashAfter -ne $targetHashBefore) {
            throw "packaged launcher write/rollback changed the source or failed to restore the target"
          }
          if ((Get-Item $archive).Length -le 0) {
            throw "archive is empty"
          }
      - uses: actions/upload-artifact@v5
        with:
          name: mh3g-save-convert-windows-x64-${{ github.sha }}
          path: |
            artifacts/mh3g-save-convert-windows-x64.zip
            artifacts/mh3g-save-convert-windows-x64.zip.sha256
            artifacts/mh3g-save-convert.exe.sha256
          if-no-files-found: error
          retention-days: 30
