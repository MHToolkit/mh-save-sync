name: mh3g-converter-windows

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/mh3g-save-convert/**
      - README.md
      - .github/workflows/mh3g-converter-windows.yml
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/mh3g-save-convert/**
      - README.md
      - .github/workflows/mh3g-converter-windows.yml

permissions:
  contents: read

jobs:
  package-windows-x64:
    name: package Windows x64 executable
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        timeout-minutes: 8
        continue-on-error: true
      - name: Test the converter on Windows x64
        run: cargo test --locked -p mh3g-save-convert
      - name: Build release executable
        run: cargo build --locked --release -p mh3g-save-convert --bin mh3g-save-convert
      - name: Package and self-verify archive
        shell: pwsh
        run: |
          $stage = "artifacts/mh3g-save-convert-windows-x64"
          $archive = "artifacts/mh3g-save-convert-windows-x64.zip"
          $checksum = "artifacts/mh3g-save-convert-windows-x64.zip.sha256"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item "target/release/mh3g-save-convert.exe" "$stage/mh3g-save-convert.exe"
          @'
          MH3G Japanese 3DS -> Wii U/Cemu save converter for Windows x64

          This package supports the Japanese MH3G profile only.
          Start with a read-only check:
            .\mh3g-save-convert.exe inspect <3DS-user1-user2-or-user3>

          Before any --write or rollback, fully exit Cemu, Azahar and Nemessix.
          Always run convert --dry-run before --write. The source save is never modified.
          See the repository README for the complete backup, dry-run and rollback procedure.
          '@ | Set-Content -NoNewline -Encoding utf8 "$stage/README-Windows.txt"
          Compress-Archive -Path $stage -DestinationPath $archive -Force
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          "$hash  mh3g-save-convert-windows-x64.zip" | Set-Content -NoNewline -Encoding ascii $checksum
          $verifyDir = Join-Path $env:RUNNER_TEMP "mh3g-save-convert-windows-x64-verify"
          Expand-Archive -Path $archive -DestinationPath $verifyDir -Force
          if (-not (Test-Path "$verifyDir/mh3g-save-convert-windows-x64/mh3g-save-convert.exe")) {
            throw "packaged executable is missing"
          }
          if ((Get-Item $archive).Length -le 0) {
            throw "archive is empty"
          }
      - uses: actions/upload-artifact@v5
        with:
          name: mh3g-save-convert-windows-x64-${{ github.sha }}
          path: |
            artifacts/mh3g-save-convert-windows-x64.zip
            artifacts/mh3g-save-convert-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30
