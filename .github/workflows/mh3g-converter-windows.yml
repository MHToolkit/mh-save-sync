name: mh3g-converter-windows

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - global.json
      - crates/mh3g-save-convert/**
      - README.md
      - README.zh-CN.md
      - apps/mh3g-save-converter-windows/**
      - packaging/mh3g-save-convert/**
      - scripts/mh3g-windows-launcher.ps1
      - scripts/package-mh3g-save-converter-windows.ps1
      - scripts/verify-mh3g-save-converter-windows-source.py
      - tests/mh3g-save-converter-windows-cli-bridge-smoke/**
      - scripts/verify-github-hosted-actions.py
      - .github/workflows/mh3g-converter-windows.yml
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - global.json
      - crates/mh3g-save-convert/**
      - README.md
      - README.zh-CN.md
      - apps/mh3g-save-converter-windows/**
      - packaging/mh3g-save-convert/**
      - scripts/mh3g-windows-launcher.ps1
      - scripts/package-mh3g-save-converter-windows.ps1
      - scripts/verify-mh3g-save-converter-windows-source.py
      - tests/mh3g-save-converter-windows-cli-bridge-smoke/**
      - scripts/verify-github-hosted-actions.py
      - .github/workflows/mh3g-converter-windows.yml

permissions:
  contents: read

jobs:
  validate-windows-x64:
    name: validate Windows x64 packaging
    # The package script uses VsDevCmd from Visual Studio 2022. Pin this
    # standard public runner instead of the moving windows-latest image.
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Provision Visual C++ workload on the disposable hosted runner
        shell: pwsh
        run: |
          choco install visualstudio2022-workload-vctools --yes --no-progress --package-parameters "--includeRecommended"
      - uses: Swatinem/rust-cache@v2
        timeout-minutes: 8
        continue-on-error: true
      - name: Verify WinUI source contract
        run: |
          python scripts/verify-mh3g-save-converter-windows-source.py
          python scripts/verify-github-hosted-actions.py
      - name: Verify UTF-8 CLI JSON bridge
        run: dotnet run --configuration Release --project tests/mh3g-save-converter-windows-cli-bridge-smoke/MH3GSaveConverter.CliBridgeSmoke.csproj
      # PR/main validation compiles the same WinUI + Rust payload but stops
      # before creating distributable ZIP/portable/installer files. Real
      # release artifacts are produced only by mh3g-converter-release.yml on v*.
      - name: Validate Windows x64 package build
        shell: pwsh
        run: |
          # Hosted runners are disposable. Bootstrap only this fresh VM rather
          # than requiring every runner image to preinstall the VS C++ workload.
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/package-mh3g-save-converter-windows.ps1 -Bootstrap -ValidateOnly
      - name: Upload Windows package transcript on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: mh3g-save-convert-windows-build-transcript-${{ github.sha }}
          path: artifacts/mh3g-save-convert-windows-build-transcript.txt
          if-no-files-found: warn
          retention-days: 3
