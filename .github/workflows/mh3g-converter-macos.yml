name: mh3g-converter-macos

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/mh3g-save-convert/**
      - README.md
      - README.zh-CN.md
      - apps/mh3g-save-converter-macos/**
      - scripts/build-mh3g-save-converter-macos-app.sh
      - scripts/mh3g-save-converter-macos-smoke.sh
      - scripts/package-mh3g-save-converter-macos.sh
      - scripts/verify-github-hosted-actions.py
      - .github/workflows/mh3g-converter-macos.yml
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/mh3g-save-convert/**
      - README.md
      - README.zh-CN.md
      - apps/mh3g-save-converter-macos/**
      - scripts/build-mh3g-save-converter-macos-app.sh
      - scripts/mh3g-save-converter-macos-smoke.sh
      - scripts/package-mh3g-save-converter-macos.sh
      - scripts/verify-github-hosted-actions.py
      - .github/workflows/mh3g-converter-macos.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package-macos-arm64:
    name: package macOS arm64 application
    # `macos-latest` is GitHub's standard Apple Silicon public-repository runner.
    # The package script rejects Intel hosts because the release archive embeds an
    # arm64 CLI and SwiftUI application.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        timeout-minutes: 8
        continue-on-error: true
      - name: Verify hosted-runner workflow policy
        run: python3 scripts/verify-github-hosted-actions.py
      - name: Test converter core and native macOS user interface
        run: |
          cargo test -p mh3g-save-convert
          swift test --package-path apps/mh3g-save-converter-macos
      - name: Build, package and self-verify macOS arm64 archive
        run: bash scripts/package-mh3g-save-converter-macos.sh
      - name: Upload macOS package transcript on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: mh3g-save-convert-macos-build-log-${{ github.sha }}
          path: |
            artifacts/mh3g-save-converter-macos
            artifacts/MH3G-Save-Converter-macOS-arm64.zip
          if-no-files-found: warn
          retention-days: 3
      - name: Upload macOS arm64 package
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: mh3g-save-convert-macos-arm64-${{ github.sha }}
          path: |
            artifacts/MH3G-Save-Converter-macOS-arm64.zip
            artifacts/MH3G-Save-Converter-macOS-arm64.zip.sha256
          if-no-files-found: error
          retention-days: 3
