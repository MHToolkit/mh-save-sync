name: ci

on:
  pull_request:
  push:
    branches: [main, feat/phase1-save-sync]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo run -p save-cli --bin mh-save -- crypto-vector
      - name: Verify deterministic device certificate fixture
        run: |
          cargo run -q -p save-cli --bin mh-save -- crypto-device-fixture > /tmp/device-identity-public.json
          python3 - <<'PY'
          import json
          with open("tests/fixtures/device-identity-public.json", "r", encoding="utf-8") as fh:
              expected = json.load(fh)
          with open("/tmp/device-identity-public.json", "r", encoding="utf-8") as fh:
              actual = json.load(fh)
          if actual != expected:
              raise SystemExit("device identity fixture drifted")
          PY
      - run: cargo run -p save-cli --bin mh-save -- snapshot-fixture tests/fixtures/generic-save
      - name: Generate UniFFI Kotlin and Swift bindings
        run: |
          cargo build --release -p save-client
          mkdir -p /tmp/uniffi/kotlin /tmp/uniffi/swift
          cargo run -p save-client --features bindgen --bin uniffi-bindgen -- \
            generate target/release/libsave_client.so --library --crate save_client \
            --language kotlin --out-dir /tmp/uniffi/kotlin --no-format
          cargo run -p save-client --features bindgen --bin uniffi-bindgen -- \
            generate target/release/libsave_client.so --library --crate save_client \
            --language swift --out-dir /tmp/uniffi/swift
          test -s /tmp/uniffi/kotlin/uniffi/save_client/save_client.kt
          test -s /tmp/uniffi/swift/save_client.swift
      - run: ./scripts/secret-scan.sh

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v5
      - name: Build and lint Android client
        working-directory: apps/android
        run: ./gradlew assembleDebug lintDebug

  macos-smoke:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - run: swift build --package-path apps/macos
      - run: swift run --package-path apps/macos MHSaveSyncMac

  compose-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Start self-hosted stack
        run: |
          mkdir -p deploy/compose/secrets
          printf 'local-postgres-password' > deploy/compose/secrets/postgres_password.txt
          printf 'minioadmin' > deploy/compose/secrets/minio_root_user.txt
          printf 'local-minio-password' > deploy/compose/secrets/minio_root_password.txt
          chmod 600 deploy/compose/secrets/*.txt
          docker compose -f deploy/compose/compose.yaml config --quiet
          docker compose -f deploy/compose/compose.yaml up -d --build --wait
          curl -fsS http://127.0.0.1:18080/ready
      - name: Run commit-ordering, conflict and resume E2E
        run: |
          python3 scripts/compose-e2e.py
          python3 scripts/compose-resume-e2e.py prepare artifacts/ci-compose-resume-state.json
          docker compose -f deploy/compose/compose.yaml restart server
          curl -fsS --retry 30 --retry-all-errors --retry-delay 1 http://127.0.0.1:18080/ready
          python3 scripts/compose-resume-e2e.py finish artifacts/ci-compose-resume-state.json
      - name: Dump compose logs on failure
        if: failure()
        run: docker compose -f deploy/compose/compose.yaml logs --no-color --tail=200
      - name: Stop self-hosted stack
        if: always()
        run: docker compose -f deploy/compose/compose.yaml down -v
