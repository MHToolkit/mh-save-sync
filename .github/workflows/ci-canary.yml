name: ci-canary

on:
  workflow_dispatch:
  schedule:
    # Low-frequency hosted-runner health check. Heavy gates stay in ci.yml.
    - cron: "17 4 * * 1"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  light-health:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Tool sanity
        run: |
          rustc --version
          cargo --version
          python3 --version
      - name: Validate lightweight scripts and manifests
        run: |
          bash -n scripts/secret-scan.sh
          bash -n scripts/automation-policy-e2e.sh
          bash -n scripts/macos-nemessix-stopped-snapshot-e2e.sh
          bash -n scripts/compose-tls-config-test.sh
          ./scripts/compose-tls-config-test.sh
          cargo metadata --no-deps --format-version 1 >/dev/null
      - name: UX copy guard
        run: python3 scripts/ux-copy-guard.py
      - name: Secret scan
        run: ./scripts/secret-scan.sh
