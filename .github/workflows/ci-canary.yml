name: ci-canary

on:
  workflow_dispatch:
  schedule:
    # Low-frequency runner health check for the shared 2c4g MHToolkit host.
    # Heavy Rust/Android/Compose gates stay in ci.yml and PR-triggered only.
    - cron: "17 4 * * 1"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  light-health:
    runs-on: [self-hosted, Linux, X64, ci-general]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Tool sanity
        run: |
          rustc --version
          cargo --version
          python3 --version
      - name: Validate lightweight scripts and manifests
        run: |
          bash -n scripts/secret-scan.sh
          bash -n scripts/automation-policy-e2e.sh
          cargo metadata --no-deps --format-version 1 >/dev/null
      - name: UX copy guard
        run: python3 scripts/ux-copy-guard.py
      - name: Secret scan
        run: ./scripts/secret-scan.sh
